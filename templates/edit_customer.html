{% extends 'base.html' %}

{% block content %}
    <h1>Edit Customer</h1>

    <form method="POST" action="{{ url_for('update_customer', customer_id=customer['customerNumber']) }}">
        <label for="customer_Name">Customer Name:</label>
        <input type="text" id="customer_Name" name="customer_Name" value="{{ customer['customerName'] }}" required><br>
    
        <label for="contact_Last_Name">Contact Last Name:</label>
        <input type="text" id="contact_Last_Name" name="contact_Last_Name" value="{{ customer['contactLastName'] }}" required><br>
    
        <label for="contact_First_Name">Contact First Name:</label>
        <input type="text" id="contact_First_Name" name="contact_First_Name" value="{{ customer['contactFirstName'] }}" required><br>
    
        <label for="phone">Phone:</label>
        <input type="text" id="phone" name="phone" value="{{ customer['phone'] }}" required><br>
    
        <label for="address_Line1">Address Line 1:</label>
        <input type="text" id="address_Line1" name="address_Line1" value="{{ customer['addressLine1'] }}" required><br>
    
        <label for="address_Line2">Address Line 2:</label>
        <input type="text" id="address_Line2" name="address_Line2" value="{{ customer['addressLine2'] }}"><br>
    
        <label for="city">City:</label>
        <input type="text" id="city" name="city" value="{{ customer['city'] }}" required><br>
    
        <label for="state">State:</label>
        <input type="text" id="state" name="state" value="{{ customer['state'] }}" required><br>
    
        <label for="postal_Code">Postal Code:</label>
        <input type="text" id="postal_Code" name="postal_Code" value="{{ customer['postalCode'] }}" required><br>
    
        <label for="country">Country:</label>
        <input type="text" id="country" name="country" value="{{ customer['country'] }}" required><br>
    
        <label for="salesRepEmployeeNumber">Sales Rep Employee Number:</label>
        <input type="text" id="salesRepEmployeeNumber" name="salesRepEmployeeNumber" value="{{ customer['salesRepEmployeeNumber'] }}" required><br>
    
        <label for="credit_Limit">Credit Limit:</label>
        <input type="number" id="credit_Limit" name="credit_Limit" value="{{ customer['creditLimit'] }}" required><br>
        <br>
        <button type="submit">Update Customer</button>
    </form>

{% endblock %}
