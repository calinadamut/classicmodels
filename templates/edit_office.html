{% extends 'base.html' %}

{% block content %}
<h1>Edit Office</h1>

<!-- Flash messages -->
{% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <div class="flashes">
            {% for category, message in messages %}
                <div class="flash {{ category }}">
                    <strong>{{ message }}</strong>
                </div>
            {% endfor %}
        </div>
    {% endif %}
{% endwith %}

<!-- Edit Office Form -->
<form method="POST" action="{{ url_for('update_office', office_id=office['officeCode']) }}">
    <label for="office_Code">Office Code:</label>
    <input type="text" id="office_Code" name="office_Code" value="{{ office['officeCode'] }}" disabled><br>

    <label for="city">City:</label>
    <input type="text" id="city" name="city" value="{{ office['city'] }}" required><br>

    <label for="phone">Phone:</label>
    <input type="text" id="phone" name="phone" value="{{ office['phone'] }}" required><br>

    <label for="address_Line1">Address Line 1:</label>
    <input type="text" id="address_Line1" name="address_Line1" value="{{ office['addressLine1'] }}" required><br>

    <label for="address_Line2">Address Line 2:</label>
    <input type="text" id="address_Line2" name="address_Line2" value="{{ office['addressLine2'] }}"><br>

    <label for="state">State:</label>
    <input type="text" id="state" name="state" value="{{ office['state'] }}" required><br>

    <label for="country">Country:</label>
    <input type="text" id="country" name="country" value="{{ office['country'] }}" required><br>

    <label for="postal_Code">Postal Code:</label>
    <input type="text" id="postal_Code" name="postal_Code" value="{{ office['postalCode'] }}" required><br>

    <label for="territory">Territory:</label>
    <input type="text" id="territory" name="territory" value="{{ office['territory'] }}" required><br><br>

    <!-- Button container should wrap BOTH forms -->
    <div class="form-buttons">
        <form method="POST" action="{{ url_for('update_office', office_id=office['officeCode']) }}">
            <button type="submit" class="update-button">Update</button>
        </form>

        <form method="POST" action="{{ url_for('delete_office', office_code=office['officeCode']) }}">
            <button type="submit" onclick="return confirm('Are you sure you want to delete this office?')" class="delete-button">
                Delete
            </button>
        </form>
        
        <a href="/offices">
        <!-- <form action="{{ url_for('get_offices') }}"> -->
            <button class="cancel-button">
                Cancel
            </button>
        </a>
        <!-- <a href="{{ url_for('get_offices') }}" class="cancel-button">Cancel</a> -->
    </div>


{% endblock %}
