{% extends 'base.html' %}

{% block content %}
    <h1>Insert New Office</h1>

    <form method="POST" action="{{ url_for('insert_office') }}">
        <label for="office_Code">Office Code (auto-generated):</label>
        <!-- <input type="text" id="office_Code" name="office_Code" required><br> -->
        <input type="text" id="office_Code" name="office_Code" disabled><br>

        <label for="city">City:</label>
        <input type="text" id="city" name="city" required><br>

        <label for="phone">Phone:</label>
        <input type="text" id="phone" name="phone" required><br>

        <label for="address_Line1">Address Line 1:</label>
        <input type="text" id="address_Line1" name="address_Line1" required><br>

        <label for="address_Line2">Address Line 2:</label>
        <input type="text" id="address_Line2" name="address_Line2"><br>

        <label for="state">State:</label>
        <input type="text" id="state" name="state" required><br>

        <label for="country">Country:</label>
        <input type="text" id="country" name="country" required><br>

        <label for="postal_Code">Postal Code:</label>
        <input type="text" id="postal_Code" name="postal_Code" required><br>

        <label for="territory">Territory:</label>
        <input type="text" id="territory" name="territory" required><br>

        <button type="submit">Insert Office</button>
    </form>
{% endblock %}
